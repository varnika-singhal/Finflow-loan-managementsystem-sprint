services:
  mysql:
    image: mysql:8.4
    container_name: finflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  sonarqube-db:
    image: postgres:16
    container_name: finflow-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: finflow-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_started
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: finflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: finflow-zipkin
    ports:
      - "9411:9411"

  config-server:
    build:
      context: ./config-server
    container_name: finflow-config-server
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - C:/Users/HP/Desktop/finflow_config-server:/config-repo
    ports:
      - "8888:8888"

  eureka-server:
    build:
      context: ./eureka-serverr/eureka-server
    container_name: finflow-eureka
    depends_on:
      config-server:
        condition: service_started
    environment:
      SERVER_PORT: 8761
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: ./auth-service
    container_name: finflow-auth
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      DB_URL: jdbc:mysql://mysql:3306/finflow_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RABBITMQ_HOST: rabbitmq
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8084:8084"

  application-service:
    build:
      context: ./application-service/application-service
    container_name: finflow-application
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      DB_URL: jdbc:mysql://mysql:3306/finflow_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RABBITMQ_HOST: rabbitmq
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8081:8081"

  document-service:
    build:
      context: ./document-service/document-service
    container_name: finflow-document
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      DB_URL: jdbc:mysql://mysql:3306/finflow_doc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RABBITMQ_HOST: rabbitmq
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8082:8082"

  admin-service:
    build:
      context: ./admin-service/admin-service
    container_name: finflow-admin
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      DB_URL: jdbc:mysql://mysql:3306/finflow_admin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RABBITMQ_HOST: rabbitmq
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8087:8087"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: finflow-gateway
    depends_on:
      auth-service:
        condition: service_started
      application-service:
        condition: service_started
      document-service:
        condition: service_started
      admin-service:
        condition: service_started
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      ADMIN_SERVICE_URL: http://admin-service:8087
      APPLICATION_SERVICE_URL: http://application-service:8081
      DOCUMENT_SERVICE_URL: http://document-service:8082
      AUTH_SERVICE_URL: http://auth-service:8084
      RABBITMQ_HOST: rabbitmq
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
